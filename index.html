<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="monetag" content="c5ceda853a1d7abd8200e24858d1b0b1">
    
    <title>Premium Video Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Automatically adapts to the user's Telegram theme */
        :root {
            --bg-color: var(--tg-theme-bg-color, #111);
            --text-color: var(--tg-theme-text-color, #fff);
            --button-color: var(--tg-theme-button-color, #f39c12);
            --button-text: var(--tg-theme-button-text-color, #fff);
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 90vh;
        }

        h2 { font-weight: 600; text-align: center; margin-top: 0; }

        #video-container {
            width: 100%; 
            max-width: 800px; 
            aspect-ratio: 16 / 9;
            background: #000; 
            border-radius: 12px; 
            overflow: hidden;
            position: relative; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: none; 
            background: #000; 
        }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(15,15,15,0.95) 0%, rgba(30,30,30,0.9) 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; text-align: center;
            padding: 20px; box-sizing: border-box;
        }

        #status-title { margin: 0 0 8px 0; font-size: 22px; font-weight: bold; }
        #status-desc { color: #ccc; margin-bottom: 25px; font-size: 15px; line-height: 1.5; }
        
        .btn {
            background: var(--button-color); 
            color: var(--button-text); 
            border: none; 
            padding: 14px 32px;
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease, background-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:active { transform: scale(0.96); }
        .btn:disabled { background: #555; cursor: not-allowed; opacity: 0.8; box-shadow: none; }
        .btn.success { background: #27ae60; color: #fff; }
    </style>
</head>
<body>

    <h2>📺 Exclusive Content</h2>

    <div id="video-container">
        <div id="overlay">
            <h3 id="status-title">Video Locked</h3>
            <p id="status-desc">Support the channel by visiting<br>our sponsor to unlock this video.</p>
            
            <button id="unlockBtn" class="btn" onclick="showAdToUser()">▶ Unlock Video</button>
        </div>

        <video id="video-player" controls controlsList="nodownload"></video>
    </div>

    <script>
        // 1. Initialize Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // ==========================================
        // 2. MONETAG CONFIGURATION
        // Replace this with your actual Monetag Direct Link
        // ==========================================
        const MONETAG_DIRECT_LINK = "YOUR_MONETAG_DIRECT_LINK_HERE"; 
        const REQUIRED_WAIT_TIME_SECONDS = 10; 
        // ==========================================

        // 3. Parse Parameters
        let videoId = null;
        let partNum = null;
        const urlParams = new URLSearchParams(window.location.search);
        const startParam = window.Telegram?.WebApp?.initDataUnsafe?.start_param || urlParams.get('startapp');

        if (startParam) {
            const match = startParam.match(/vid_(.*)_part_(\d+)/);
            if (match) {
                videoId = match[1].toLowerCase();
                partNum = match[2];
            }
        }

        const player = document.getElementById('video-player');
        const overlayTitle = document.getElementById('status-title');
        const overlayDesc = document.getElementById('status-desc');
        const unlockBtn = document.getElementById('unlockBtn');

        // 4. Setup Video Environment
        if (videoId && partNum) {
            const paddedPart = partNum.padStart(3, '0');
            const videoUrl = `segments/${videoId}_part_${paddedPart}.mp4`;
            
            player.src = videoUrl; 
            player.load();

            player.onerror = function() {
                overlayTitle.innerText = "❌ Video Not Found";
                overlayDesc.innerHTML = `Unable to locate segment:<br><code style="color:#ff6b6b; margin-top:8px; display:inline-block;">${videoUrl}</code>`;
                unlockBtn.style.display = 'none';
            };
        } else {
            overlayTitle.innerText = "❌ Invalid Link";
            overlayDesc.innerText = "Please open this player directly from the Telegram bot.";
            unlockBtn.style.display = 'none';
        }

        // 5. Robust Playback Function
        function unlockAndPlay() {
            const overlay = document.getElementById('overlay');
            
            overlay.style.display = 'none';
            player.style.display = 'block';
            
            try {
                const playPromise = player.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log("✅ Video started successfully.");
                    }).catch(error => {
                        console.log("⚠️ Auto-play interrupted. Attempting safe retry...", error);
                        setTimeout(() => {
                            const retryPromise = player.play();
                            if (retryPromise !== undefined) {
                                retryPromise.catch(e => {
                                    console.log("❌ Auto-play completely blocked. User must click play.", e);
                                    player.controls = true; 
                                });
                            }
                        }, 500); 
                    });
                }
            } catch (err) {
                console.error("Critical player error:", err);
                player.controls = true;
            }
        }

        // 6. Monetag Ad Display Logic
        function showAdToUser() {
            // Bypass if link isn't set yet
            if (!MONETAG_DIRECT_LINK || MONETAG_DIRECT_LINK === "YOUR_MONETAG_DIRECT_LINK_HERE") {
                console.warn("Monetag link not configured. Bypassing straight to video.");
                unlockAndPlay();
                return;
            }

            // Open the Monetag link. 
            // We use Telegram's native openLink to ensure it works properly inside the Mini App.
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                window.Telegram.WebApp.openLink(MONETAG_DIRECT_LINK);
            } else {
                window.open(MONETAG_DIRECT_LINK, '_blank');
            }

            // Start the rewarded countdown timer
            let countdown = REQUIRED_WAIT_TIME_SECONDS;
            unlockBtn.disabled = true;
            unlockBtn.innerText = `⌛ Checking Sponsor... (${countdown}s)`;

            const timer = setInterval(() => {
                countdown--;
                unlockBtn.innerText = `⌛ Checking Sponsor... (${countdown}s)`;

                if (countdown <= 0) {
                    clearInterval(timer);
                    unlockBtn.classList.add('success');
                    unlockBtn.innerText = "✅ Unlocked!";
                    
                    console.log("✅ Wait time finished! Rewarding user...");
                    
                    // Short delay so the user sees the "Unlocked!" message before the UI switches
                    setTimeout(() => {
                        unlockAndPlay(); 
                    }, 800);
                }
            }, 1000);
        }
    </script>
</body>
</html>
